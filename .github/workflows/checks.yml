name: checks

# Is what is committed self-consistent? Nothing here regenerates anything - it verifies
# that the derived files match their sources and that the provenance record still agrees
# with the ontology. Regeneration stays a deliberate act by a person.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # -c pins the exact versions the derived files were generated with. Without it a new
      # rdflib could reorder its Turtle output and fail the build for a reason that has
      # nothing to do with the commit under review.
      - run: pip install -r tools/requirements.txt -c tools/constraints.txt

      # --strict fails the build when a derived file is stale, or when a stored query has
      # not been verified against what is committed. The provenance report runs but does
      # not gate: it lists things needing human judgement - an axiom nobody has documented
      # yet, a sentence that needs rewriting - and CI should not fail because a decision is
      # outstanding.
      #
      # The stored queries were the reason --strict-provenance was held back, and they are
      # fixed: prov_check.py now reports nothing. Add the flag when you want an
      # undocumented axiom to fail the build.
      - name: derived files current, queries verified, provenance record consistent
        run: python tools/check_all.py --strict
